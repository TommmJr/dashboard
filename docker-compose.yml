version: '3.8'

services:
  # App service (Laravel + Apache)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plnjbt_app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - plnjbt_network

  # Database service (MySQL)
  db:
    image: mysql:8.4
    container_name: plnjbt_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dashboard
      MYSQL_USER: dashboard
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - plnjbt_network

networks:
  plnjbt_network:
    driver: bridge

volumes:
  db_data:
